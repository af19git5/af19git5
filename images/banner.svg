<svg xmlns='http://www.w3.org/2000/svg'
     xmlns:xlink='http://www.w3.org/1999/xlink'
     viewBox='0 0 600 120'
     style='background-color: #00000000;'
     width='600px' height='120px'>
    <path id='path0'>
        <!-- Single line -->
        <animate id='d0' attributeName='d' begin='0s;d1.end'
                 dur='6000ms' fill='remove'
                 values='m0,60 h0 ; m0,60 h600 ; m0,60 h600 ; m0,60 h0'
                 keyTimes='0;0.66666666666667;0.83333333333333;1'/>
    </path>
    <text font-family='"Fira Code", monospace' fill='#30F700' font-size='40'
          dominant-baseline='middle'
          x='50%' text-anchor='middle'
          letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hi I&#039;m Jimmy.
        </textPath>
    </text>
    <path id='path1'>
        <!-- Single line -->
        <animate id='d1' attributeName='d' begin='d0.end'
                 dur='6000ms' fill='remove'
                 values='m0,60 h0 ; m0,60 h600 ; m0,60 h600 ; m0,60 h0'
                 keyTimes='0;0.66666666666667;0.83333333333333;1'/>
    </path>
    <text font-family='"Fira Code", monospace' fill='#30F700' font-size='40'
          dominant-baseline='middle'
          x='50%' text-anchor='middle'
          letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Welcome to my GitHub!
        </textPath>
    </text>
</svg>
